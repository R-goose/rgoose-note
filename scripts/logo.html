<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>R-Goose Note · Origami Final</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Outfit:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #0a0d0b;
            --surface: #131814;
            --border: #222b26;
            --green: #6bbd8f;
            --text: #e8ece8;
            --text-mid: #909a94;
            --text-dim: #5a655f;
            --serif: 'Fraunces', Georgia, serif;
            --sans: 'Outfit', sans-serif;
            --mono: 'IBM Plex Mono', monospace;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-weight: 300;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 50% 5%, rgba(143, 218, 176, 0.06) 0%, transparent 50%);
        }

        .grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 0 32px
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 0;
            border-bottom: 1px solid var(--border)
        }

        .brand {
            font-family: var(--serif);
            font-weight: 600;
            font-size: 20px
        }

        .brand em {
            font-style: italic;
            font-weight: 300;
            color: var(--green)
        }

        .hdr-meta {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            text-transform: uppercase
        }

        @keyframes rv {
            from {
                opacity: 0;
                transform: translateY(24px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .rv {
            opacity: 0;
            animation: rv .8s cubic-bezier(.16, 1, .3, 1) forwards
        }

        .d1 {
            animation-delay: .1s
        }

        .d2 {
            animation-delay: .2s
        }

        .d3 {
            animation-delay: .3s
        }

        .d4 {
            animation-delay: .4s
        }

        .d5 {
            animation-delay: .5s
        }

        .d6 {
            animation-delay: .6s
        }

        .hero {
            text-align: center;
            padding: 56px 0 36px
        }

        .hero-label {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--green);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 14px
        }

        .hero-title {
            font-family: var(--serif);
            font-weight: 300;
            font-size: 42px;
            letter-spacing: -0.03em;
            margin-bottom: 10px
        }

        .hero-title em {
            font-style: italic;
            font-weight: 600
        }

        .hero-sub {
            font-size: 15px;
            color: var(--text-mid);
            max-width: 440px;
            margin: 0 auto
        }

        /* Main feature */
        .feature {
            padding: 24px 0 40px
        }

        .feature-main {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            position: relative
        }

        .feature-img {
            width: 100%;
            aspect-ratio: 1;
            display: block;
            background: #0d110e;
            object-fit: cover;
            border-radius: 24px;
        }

        .feature-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 28px 32px;
            background: linear-gradient(0deg, rgba(10, 13, 11, 0.92) 0%, transparent 100%)
        }

        .feature-name {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 24px;
            margin-bottom: 4px
        }

        .feature-desc {
            font-size: 13px;
            color: var(--text-mid)
        }

        /* Variants */
        .sec-head {
            margin: 24px 0 24px;
            text-align: center
        }

        .sec-tag {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 6px
        }

        .sec-title {
            font-family: var(--serif);
            font-weight: 300;
            font-size: 28px
        }

        .sec-title em {
            font-style: italic;
            font-weight: 600
        }

        .vgrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            padding: 0 0 56px
        }

        .vcard {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: all .3s
        }

        .vcard:hover {
            border-color: var(--green);
            transform: translateY(-4px)
        }

        .vimg {
            width: 100%;
            aspect-ratio: 1;
            display: block;
            background: #0d110e;
            object-fit: cover
        }

        .vinfo {
            padding: 12px 14px
        }

        .vnum {
            font-family: var(--mono);
            font-size: 9px;
            color: var(--text-dim);
            margin-bottom: 2px
        }

        .vname {
            font-family: var(--serif);
            font-size: 14px;
            font-weight: 400
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0
            }

            100% {
                background-position: 200% 0
            }
        }

        .loading {
            background: linear-gradient(90deg, #131814 25%, #1a211d 50%, #131814 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite
        }

        footer {
            text-align: center;
            padding: 32px 0;
            border-top: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 0.15em;
            text-transform: uppercase
        }
    </style>
</head>

<body>
    <div class="grain"></div>
    <div class="wrap">

        <header class="rv d1">
            <div class="brand">R-Goose<em> Note</em></div>
            <div class="hdr-meta">Origami · Final</div>
        </header>

        <section class="hero">
            <div class="hero-label rv d1">Original Style · Color Adjusted</div>
            <h1 class="hero-title rv d2">折纸 · <em>终版</em></h1>
            <p class="hero-sub rv d3">保留原始折纸风格，鹅嘴改橙色，背景改浅绿。</p>
        </section>

        <!-- Main featured image -->
        <div class="feature rv d3">
            <div class="feature-main">
                <img class="feature-img loading"
                    src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=app%20icon%20design%20origami%20paper%20goose%20white%20folded%20paper%20geometric%20minimal%20small%20bright%20orange%20beak%20light%20pale%20green%20background%20flat%20design%20sharp%20edges%20professional%20modern%20clean%20centered%20rounded%20square&image_size=square"
                    alt="Origami Goose Main" onload="this.classList.remove('loading')">
            </div>
        </div>

        <!-- Variants -->
        <div class="sec-head rv d4">
            <div class="sec-tag">More Variations</div>
            <h2 class="sec-title">同风格 <em>微调</em></h2>
        </div>

        <div class="vgrid">

            <div class="vcard rv d4">
                <img class="vimg loading"
                    src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=app%20icon%20design%20origami%20paper%20goose%20white%20folded%20paper%20geometric%20minimal%20bright%20orange%20beak%20facing%20right%20pale%20light%20green%20background%20flat%20design%20sharp%20edges%20professional%20modern%20clean%20centered&image_size=square_hd"
                    alt="V1" onload="this.classList.remove('loading')">
                <div class="vinfo">
                    <div class="vnum">A</div>
                    <div class="vname">朝右</div>
                </div>
            </div>

            <div class="vcard rv d5">
                <img class="vimg loading"
                    src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=app%20icon%20design%20origami%20paper%20goose%20head%20and%20neck%20white%20folded%20paper%20geometric%20minimal%20orange%20beak%20very%20light%20mint%20green%20background%20flat%20design%20sharp%20edges%20professional%20modern%20clean%20centered%20rounded%20square&image_size=square_hd"
                    alt="V2" onload="this.classList.remove('loading')">
                <div class="vinfo">
                    <div class="vnum">B</div>
                    <div class="vname">头颈</div>
                </div>
            </div>

            <div class="vcard rv d5">
                <img class="vimg loading"
                    src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=app%20icon%20design%20origami%20paper%20goose%20full%20body%20standing%20white%20folded%20paper%20geometric%20minimal%20orange%20beak%20light%20green%20background%20flat%20design%20sharp%20edges%20professional%20modern%20clean%20centered%20rounded%20square&image_size=square_hd"
                    alt="V3" onload="this.classList.remove('loading')">
                <div class="vinfo">
                    <div class="vnum">C</div>
                    <div class="vname">全身</div>
                </div>
            </div>

            <div class="vcard rv d6">
                <img class="vimg loading"
                    src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=app%20icon%20design%20origami%20paper%20goose%20simple%20elegant%20white%20folded%20paper%20geometric%20minimal%20small%20orange%20beak%20soft%20pale%20green%20background%20flat%20design%20sharp%20edges%20professional%20modern%20clean%20minimalist%20centered%20rounded%20square&image_size=square_hd"
                    alt="V4" onload="this.classList.remove('loading')">
                <div class="vinfo">
                    <div class="vnum">D</div>
                    <div class="vname">极简</div>
                </div>
            </div>

        </div>

        <footer>R-Goose Note · Origami Final · 2025</footer>

    </div>
</body>

</html>
