<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#5a9e7a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <title>R-Goose Note</title>
    <script>
      // 在任何绘制前应用已保存的主题，避免深色用户看到亮色闪变（auto 跟随系统）
      try {
        var __savedTheme = localStorage.getItem('rgoose_theme')
        var __dark = __savedTheme === 'dark' || (__savedTheme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (__dark) document.documentElement.setAttribute('data-theme', 'dark')
      } catch (e) {}
    </script>
    <style>
      /* 启动 splash：果冻软弹风格，全内联零依赖，随主题变深浅，Vue 挂载后淡出移除
         分镜：色块从四面软弹聚拢到中心叠成彩色果冻堆(0-0.76s)
              → 鹅徽标砸上果冻堆：下落拉伸→大力压扁→回弹落定，堆同步果冻震荡(0.55-1.5s)
              → 色块受重力依次脱落坠落出画面(1.25-2.4s) → 标题/进度条弹跳出场，徽标摇摆待机 */
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fafbfa;
        opacity: 1;
        transition: opacity 0.32s ease;
        overflow: hidden;
      }
      [data-theme="dark"] #splash-screen { background: #161917; }
      #splash-screen.splash-hide { opacity: 0; pointer-events: none; }

      /* ===== 大色块（卡通硬投影；外层管飞入聚拢+重力坠落，内层管果冻震荡） ===== */
      .sp-blocks { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
      .sp-block { position: absolute; left: 50%; top: calc(50% - 38px); will-change: transform; }
      .sp-jelly { width: 100%; height: 100%; will-change: transform; }

      .sp-block--tl {
        width: 200px; height: 200px; margin: -195px 0 0 -170px;
        animation: sp-fly-tl 0.55s cubic-bezier(0.22, 1.4, 0.32, 1) 0.13s both,
                   sp-fall-tl 0.72s cubic-bezier(0.55, 0, 0.8, 0.4) 1.41s both;
      }
      .sp-block--tl .sp-jelly {
        border-radius: 50%; background: #8fd8ac;
        box-shadow: 10px 12px 0 rgba(26, 31, 28, 0.05);
        animation: sp-jelly 1.05s ease-out 0.55s both;
      }
      .sp-block--tr {
        width: 170px; height: 170px; margin: -173px 0 0 -10px;
        animation: sp-fly-tr 0.55s cubic-bezier(0.22, 1.4, 0.32, 1) 0.05s both,
                   sp-fall-tr 0.72s cubic-bezier(0.55, 0, 0.8, 0.4) 1.49s both;
      }
      .sp-block--tr .sp-jelly {
        border-radius: 40px; background: #b3d2ee;
        box-shadow: -10px 12px 0 rgba(26, 31, 28, 0.05);
        animation: sp-jelly 1.05s ease-out 0.6s both;
      }
      .sp-block--bl {
        width: 160px; height: 160px; margin: -12px 0 0 -172px;
        animation: sp-fly-bl 0.55s cubic-bezier(0.22, 1.4, 0.32, 1) 0.09s both,
                   sp-fall-bl 0.72s cubic-bezier(0.55, 0, 0.8, 0.4) 1.57s both;
      }
      .sp-block--bl .sp-jelly {
        border-radius: 36px; background: #ecd6a9;
        box-shadow: 10px -8px 0 rgba(26, 31, 28, 0.05);
        animation: sp-jelly 1.05s ease-out 0.64s both;
      }
      .sp-block--br {
        width: 150px; height: 150px; margin: -3px 0 0 17px;
        animation: sp-fly-br 0.55s cubic-bezier(0.22, 1.4, 0.32, 1) 0.21s both,
                   sp-fall-br 0.72s cubic-bezier(0.55, 0, 0.8, 0.4) 1.65s both;
      }
      .sp-block--br .sp-jelly {
        border-radius: 50%; background: #c9bdf0;
        box-shadow: -8px -8px 0 rgba(26, 31, 28, 0.05);
        animation: sp-jelly 1.05s ease-out 0.68s both;
      }
      .sp-block--ml {
        width: 84px; height: 84px; margin: -50px 0 0 -188px;
        animation: sp-fly-ml 0.55s cubic-bezier(0.22, 1.45, 0.32, 1) 0s both,
                   sp-fall-ml 0.72s cubic-bezier(0.55, 0, 0.8, 0.4) 1.25s both;
      }
      .sp-block--ml .sp-jelly {
        border-radius: 50%; background: #f6b45b;
        box-shadow: 7px 7px 0 rgba(26, 31, 28, 0.06);
        animation: sp-jelly 1.05s ease-out 0.55s both;
      }
      .sp-block--mr {
        width: 76px; height: 76px; margin: -32px 0 0 107px;
        animation: sp-fly-mr 0.55s cubic-bezier(0.22, 1.45, 0.32, 1) 0.17s both,
                   sp-fall-mr 0.72s cubic-bezier(0.55, 0, 0.8, 0.4) 1.33s both;
      }
      .sp-block--mr .sp-jelly {
        border-radius: 18px; background: #f0b3b3;
        box-shadow: -7px 7px 0 rgba(26, 31, 28, 0.06);
        animation: sp-jelly 1.05s ease-out 0.62s both;
      }

      [data-theme="dark"] .sp-block--tl .sp-jelly { background: #20402c; box-shadow: 10px 12px 0 rgba(0, 0, 0, 0.3); }
      [data-theme="dark"] .sp-block--tr .sp-jelly { background: #1d3446; box-shadow: -10px 12px 0 rgba(0, 0, 0, 0.3); }
      [data-theme="dark"] .sp-block--bl .sp-jelly { background: #3f3423; box-shadow: 10px -8px 0 rgba(0, 0, 0, 0.3); }
      [data-theme="dark"] .sp-block--br .sp-jelly { background: #312b4e; box-shadow: -8px -8px 0 rgba(0, 0, 0, 0.3); }
      [data-theme="dark"] .sp-block--ml .sp-jelly { background: #6b4715; box-shadow: 7px 7px 0 rgba(0, 0, 0, 0.32); }
      [data-theme="dark"] .sp-block--mr .sp-jelly { background: #4a2727; box-shadow: -7px 7px 0 rgba(0, 0, 0, 0.32); }

      /* ===== 中央内容 ===== */
      .sp-center {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .sp-hero { position: relative; width: 120px; height: 120px; margin-bottom: 24px; }

      /* 鹅徽标：砸上果冻堆（squash & stretch）后摇摆待机 */
      .sp-logo-wrap {
        position: absolute; left: 50%; top: 50%; width: 84px; height: 84px;
        margin: -42px 0 0 -42px; z-index: 2;
        animation: sp-slam 0.95s linear 0.55s both;
      }
      .sp-logo {
        position: absolute; inset: 0; width: 100%; height: 100%;
        border-radius: 22%;
        object-fit: cover;
        filter: drop-shadow(0 5px 14px rgba(52, 120, 84, 0.28));
        animation: sp-bob 2.4s ease-in-out 1.6s infinite;
      }

      /* 标题与进度条（弹跳出场） */
      .sp-name {
        font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 17px; font-weight: 800; letter-spacing: 0.8px; color: #22302a;
        text-shadow: 0 2px 0 rgba(26, 31, 28, 0.05);
        animation: sp-pop 0.45s cubic-bezier(0.34, 1.56, 0.44, 1) 1.45s both;
      }
      .sp-name span { color: #3da353; }
      [data-theme="dark"] .sp-name { color: #eef2ef; text-shadow: none; }
      [data-theme="dark"] .sp-name span { color: #51c467; }
      .sp-bar {
        width: 200px; height: 8px; margin-top: 18px; border-radius: 99px;
        overflow: hidden; background: rgba(61, 163, 83, 0.14);
        animation: sp-pop 0.4s cubic-bezier(0.34, 1.56, 0.44, 1) 1.6s both;
      }
      [data-theme="dark"] .sp-bar { background: rgba(255, 255, 255, 0.1); }
      .sp-bar-inner {
        height: 100%; width: 42%; border-radius: 99px; background: #52a377;
        animation: sp-slide 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      [data-theme="dark"] .sp-bar-inner { background: #51c467; }

      /* ===== 淡出收尾 ===== */
      #splash-screen.splash-hide * { animation: none !important; }
      #splash-screen.splash-hide .sp-logo { transform: translateY(-10px) scale(0.94); }

      /* ===== keyframes ===== */
      /* 飞入聚拢：从屏幕边缘冲向中心，过冲回弹撞定 */
      @keyframes sp-fly-tl { from { transform: translate(-48vw, -34vh); } to { transform: none; } }
      @keyframes sp-fly-tr { from { transform: translate(46vw, -30vh) rotate(40deg); } to { transform: rotate(12deg); } }
      @keyframes sp-fly-bl { from { transform: translate(-46vw, 36vh) rotate(-40deg); } to { transform: rotate(-10deg); } }
      @keyframes sp-fly-br { from { transform: translate(46vw, 36vh); } to { transform: none; } }
      @keyframes sp-fly-ml { from { transform: translate(-46vw, 6vh); } to { transform: none; } }
      @keyframes sp-fly-mr { from { transform: translate(46vw, -6vh) rotate(60deg); } to { transform: rotate(18deg); } }

      /* 果冻震荡：撞击后多次压缩-拉伸-回正，幅度逐次衰减 */
      @keyframes sp-jelly {
        0%, 100% { transform: scale(1, 1); }
        16% { transform: scale(1.22, 0.78); }
        33% { transform: scale(0.88, 1.14); }
        50% { transform: scale(1.1, 0.9); }
        67% { transform: scale(0.96, 1.05); }
        84% { transform: scale(1.02, 0.98); }
      }

      /* 重力坠落：依次脱落，加速下坠出画面（from 态与聚拢撞定态一致，避免回跳） */
      @keyframes sp-fall-tl { from { transform: none; } to { transform: translate(-6vw, 72vh) rotate(-24deg); } }
      @keyframes sp-fall-tr { from { transform: rotate(12deg); } to { transform: translate(7vw, 76vh) rotate(30deg); } }
      @keyframes sp-fall-bl { from { transform: rotate(-10deg); } to { transform: translate(-8vw, 78vh) rotate(-18deg); } }
      @keyframes sp-fall-br { from { transform: none; } to { transform: translate(6vw, 74vh) rotate(22deg); } }
      @keyframes sp-fall-ml { from { transform: none; } to { transform: translate(-3vw, 70vh) rotate(-14deg); } }
      @keyframes sp-fall-mr { from { transform: rotate(18deg); } to { transform: translate(4vw, 72vh) rotate(26deg); } }

      /* 鹅徽标砸上果冻堆：下落拉伸→大力压扁→堆把它弹起→二次落定 */
      @keyframes sp-slam {
        0% { transform: translateY(-190px) scale(1, 1); opacity: 0; }
        12% { opacity: 1; }
        40% { transform: translateY(14px) scale(0.94, 1.12); opacity: 1; }
        52% { transform: translateY(0) scale(1.34, 0.66); opacity: 1; }
        66% { transform: translateY(-22px) scale(0.9, 1.14); }
        78% { transform: translateY(0) scale(1.12, 0.9); }
        88% { transform: translateY(-6px) scale(0.97, 1.04); }
        100% { transform: translateY(0) scale(1, 1); }
      }
      @keyframes sp-bob {
        0%, 100% { transform: translateY(0) rotate(-1.6deg); }
        50% { transform: translateY(-7px) rotate(1.6deg); }
      }
      @keyframes sp-pop {
        from { transform: scale(0.3) translateY(16px); opacity: 0; }
        65% { transform: scale(1.1) translateY(-2px); opacity: 1; }
        to { transform: none; opacity: 1; }
      }
      @keyframes sp-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(340%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash-screen, #splash-screen * {
          animation-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash-screen" aria-hidden="true">
      <div class="sp-blocks">
        <div class="sp-block sp-block--tl"><div class="sp-jelly"></div></div>
        <div class="sp-block sp-block--tr"><div class="sp-jelly"></div></div>
        <div class="sp-block sp-block--bl"><div class="sp-jelly"></div></div>
        <div class="sp-block sp-block--br"><div class="sp-jelly"></div></div>
        <div class="sp-block sp-block--ml"><div class="sp-jelly"></div></div>
        <div class="sp-block sp-block--mr"><div class="sp-jelly"></div></div>
      </div>
      <div class="sp-center">
        <div class="sp-hero">
          <div class="sp-logo-wrap">
            <img class="sp-logo" src="favicon.png" alt="R-Goose Note" />
          </div>
        </div>
        <div class="sp-name">R-Goose <span>Note</span></div>
        <div class="sp-bar"><div class="sp-bar-inner"></div></div>
      </div>
    </div>
    <script>window.__splashStart = Date.now()</script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
