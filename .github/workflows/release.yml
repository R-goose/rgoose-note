name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的版本标签（例如 v2.5.0）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Local Windows release
    # 由此 Mac 的专用 Runner 执行：避免 GitHub Hosted Runner 到 Gitee
    # 的大文件跨网传输，并让工作流使用已有的 GITEE_TOKEN Secret。
    runs-on: [self-hosted, macOS, ARM64, rgoose-note-release]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 使用 LTS 版本，避免 Node 24 的实验性运行时行为影响 Gitee 大文件上传。
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/verify-release-version.mjs

      - name: Build and publish Windows installer to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: npm run electron:publish:gitee:win
