name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的版本标签（例如 v2.5.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Windows release
    # 由 GitHub 托管的 Windows Runner 上传到 GitHub Release，避开本机代理
    # 对大文件上传的中断；公开仓库的 GitHub Actions 不计时收费。
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 使用 LTS 版本，避免 Node 24 的实验性运行时行为影响 Gitee 大文件上传。
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/verify-release-version.mjs

      - name: Build Windows installer
        run: npm run electron:build:win

      - name: Publish Windows updater to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          files: |
            release-build-*/R-Goose Note Setup *.exe
            release-build-*/R-Goose Note Setup *.exe.blockmap
            release-build-*/latest.yml
          fail_on_unmatched_files: true
